<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký | EnglishHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Thanh điều hướng -->
    <header class="navbar">
    <div class="navbar-container">
        <a href="index.html" class="logo">EnglishHub</a>

        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="index.html#lessons">Bài học</a>
            <a href="index.html#progress">Trình độ</a>

            <div class="account-links">
                <a href="login.html" class="btn-login">Đăng nhập</a>
                <a href="register.html" class="btn-register">Đăng ký</a>
            </div>
        </nav>
    </div>
</header>

    <!-- Nội dung đăng ký -->
    <main class="account-container">

        <section class="account-card">

            <h1>Tạo tài khoản</h1>

            <p class="account-description">
                Tham gia EnglishHub để bắt đầu hành trình học tiếng Anh!
            </p>

            <form id="register-form">

                <div class="form-group">
                    <label for="fullname">Họ và tên</label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Nhập họ và tên"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Xác nhận mật khẩu
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Nhập lại mật khẩu"
                        minlength="6"
                        required
                    >
                </div>

                <p id="register-message" class="account-message"></p>

                <button type="submit" class="account-button">
                    Đăng ký
                </button>

            </form>

            <p class="account-footer">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập</a>
            </p>

        </section>

    </main>

    <footer>
        <p>EnglishHub - Learn English step by step.</p>
    </footer>
<script src="auth.js"></script>
</body>

</html>
