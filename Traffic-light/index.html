
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều khiển đèn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Điều khiển đèn giao thông</h1>
        <p>Nhấn vào nút để bật đèn tương ứng</p>

        <div class="traffic-light">
            <div id="red" class="light"></div>
            <div id="yellow" class="light"></div>
            <div id="green" class="light"></div>
        </div>

        <div class="buttons">
            <button class="btn-green" onclick="batDen('green')">
                Đèn xanh
            </button>

            <button class="btn-yellow" onclick="batDen('yellow')">
                Đèn vàng
            </button>

            <button class="btn-red" onclick="batDen('red')">
                Đèn đỏ
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
